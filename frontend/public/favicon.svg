<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2008" />
      <stop offset="50%" stop-color="#131722" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base container with subtle golden border -->
  <rect width="64" height="64" rx="16" fill="url(#goldBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#goldShine)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Gold Bullion Icon -->
  <g filter="url(#glow)">
    <!-- Lower / Main Gold Bar -->
    <!-- Top Face -->
    <polygon points="18,36 32,28 46,36 32,44" fill="url(#goldShine)" />
    <!-- Left Face -->
    <polygon points="18,36 18,43 32,51 32,44" fill="url(#goldDark)" />
    <!-- Right Face -->
    <polygon points="46,36 46,43 32,51 32,44" fill="#92400E" />
    <!-- Top Highlights -->
    <polygon points="21,36 32,29.5 43,36 32,42.5" fill="#FEF3C7" opacity="0.4" />

    <!-- Upper Gold Bar -->
    <!-- Top Face -->
    <polygon points="22,25 32,19 42,25 32,31" fill="url(#goldShine)" />
    <!-- Left Face -->
    <polygon points="22,25 22,30 32,36 32,31" fill="url(#goldDark)" />
    <!-- Right Face -->
    <polygon points="42,25 42,30 32,36 32,31" fill="#92400E" />
    
    <!-- Shiny Sparkle -->
    <polygon points="47,15 48.5,18.5 52,20 48.5,21.5 47,25 45.5,21.5 42,20 45.5,18.5" fill="#FFFBEB" />
  </g>
</svg>