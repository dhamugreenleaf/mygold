<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2234"/>
      <stop offset="50%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="silverGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="goldGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad512)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#goldGrad512)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Orbital Vault Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#goldGrad512)" stroke-width="6" stroke-opacity="0.3" stroke-dasharray="16 10"/>

  <!-- Bullion & Vault Emblem -->
  <g filter="url(#goldGlow512)">
    <!-- Base Gold Bullion Ingot -->
    <path d="M160 300 L256 248 L352 300 L256 352 Z" fill="url(#goldGrad512)"/>
    <path d="M160 300 L160 326 L256 378 L256 352 Z" fill="#B45309"/>
    <path d="M352 300 L352 326 L256 378 L256 352 Z" fill="#78350F"/>

    <!-- Mid Silver Ingot -->
    <path d="M192 236 L256 200 L320 236 L256 272 Z" fill="url(#silverGrad512)"/>
    <path d="M192 236 L192 252 L256 288 L256 272 Z" fill="#64748B"/>
    <path d="M320 236 L320 252 L256 288 L256 272 Z" fill="#334155"/>

    <!-- Top Star Crown -->
    <polygon points="256,128 266,154 294,158 274,178 278,206 256,192 234,206 238,178 218,158 246,154" fill="#FDE68A"/>
  </g>
</svg>
